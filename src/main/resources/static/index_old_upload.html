<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Validator - Phụ lục I.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #0F172A;
            --surface: #1E293B;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border: #334155;
            --success: #10B981;
            --error: #EF4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: var(--surface);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 600px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #818CF8 0%, #C084FC 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 15px;
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            background: rgba(30, 41, 59, 0.5);
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.1);
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .upload-subtext {
            font-size: 13px;
            color: var(--text-muted);
        }

        #file-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-info {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 8px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .file-name {
            font-weight: 500;
            color: #818CF8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80%;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 30px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0.5;
            pointer-events: none;
        }

        .btn-submit.active {
            opacity: 1;
            pointer-events: auto;
        }

        .btn-submit.active:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        .btn-submit.loading {
            background: var(--text-muted);
            pointer-events: none;
        }

        .status-message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            font-size: 14px;
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        .status-success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
            display: block;
        }

        .status-error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: block;
        }

        .loader {
            display: none;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        /* Toast Notification */
        #bqp_toast_container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 100020;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 440px;
            width: calc(100% - 48px);
            pointer-events: none;
        }
        @media (max-width: 640px) {
            #bqp_toast_container {
                top: auto;
                bottom: 20px;
                right: 16px;
                left: 16px;
                width: auto;
                max-width: none;
            }
        }
        .bqp-toast {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background: #ffffff;
            border-radius: 8px;
            padding: 14px 16px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.25);
            border-left: 5px solid #1e3a8a;
            color: #0f172a;
            font-size: 13.5px;
            line-height: 1.5;
            pointer-events: auto;
            opacity: 0;
            transform: translateX(30px);
            transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            word-break: break-word;
        }
        .bqp-toast.bqp-toast-visible { opacity: 1; transform: translateX(0); }
        .bqp-toast.bqp-toast-removing { opacity: 0; transform: scale(0.92) translateY(-10px); transition: all 0.25s; }
        .bqp-toast-icon { flex-shrink: 0; width: 22px; height: 22px; margin-top: 1px; }
        .bqp-toast-content { flex: 1; min-width: 0; color: #1e293b; }
        .bqp-toast-close { flex-shrink: 0; background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 18px; line-height: 1; }
        .bqp-toast-success { border-left-color: #10B981; }
        .bqp-toast-success .bqp-toast-icon { color: #10B981; }
        .bqp-toast-error { border-left-color: #EF4444; }
        .bqp-toast-error .bqp-toast-icon { color: #EF4444; }
        .bqp-toast-info { border-left-color: #4F46E5; }
        .bqp-toast-info .bqp-toast-icon { color: #4F46E5; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Excel Validator Pro</h1>
            <p>Kiểm tra tự động Phụ lục I.1 và sinh Phụ lục II</p>
        </div>

        <form id="uploadForm">
            <div class="upload-area" id="drop-zone">
                <div class="upload-icon">📊</div>
                <div class="upload-text">Kéo thả file Excel vào đây</div>
                <div class="upload-subtext">hoặc click để chọn file từ máy tính</div>
                <input type="file" id="file-input" name="file" accept=".xlsx,.xls">
            </div>

            <div class="file-info" id="file-info-container" style="display: none;">
                <div class="file-name" id="file-name-display"></div>
                <div style="cursor: pointer; color: var(--error);" id="remove-file">✕</div>
            </div>

            <button type="submit" class="btn-submit" id="submit-btn">
                <span class="btn-text">Kiểm Tra Ngay</span>
                <div class="loader" id="loader"></div>
            </button>
        </form>

        <div id="status-message" class="status-message"></div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileInfoContainer = document.getElementById('file-info-container');
        const fileNameDisplay = document.getElementById('file-name-display');
        const removeFileBtn = document.getElementById('remove-file');
        const submitBtn = document.getElementById('submit-btn');
        const uploadForm = document.getElementById('uploadForm');
        const statusMessage = document.getElementById('status-message');
        const loader = document.getElementById('loader');
        const btnText = document.querySelector('.btn-text');

        // Drag and Drop Events
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }

        fileInput.addEventListener('change', function() {
            handleFiles(this.files);
        });

        function handleFiles(files) {
            if (files.length > 0) {
                const file = files[0];
                if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
                    fileInput.files = files; 
                    fileNameDisplay.textContent = file.name;
                    fileInfoContainer.style.display = 'flex';
                    submitBtn.classList.add('active');
                    statusMessage.className = 'status-message';
                } else {
                    showStatus('Vui lòng chọn file Excel hợp lệ (.xlsx, .xls)', 'error');
                }
            }
        }

        removeFileBtn.addEventListener('click', () => {
            fileInput.value = '';
            fileInfoContainer.style.display = 'none';
            submitBtn.classList.remove('active');
            statusMessage.className = 'status-message';
        });

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!fileInput.files.length) return;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            // Set loading state
            btnText.style.display = 'none';
            loader.style.display = 'block';
            submitBtn.classList.add('loading');
            statusMessage.className = 'status-message';

            try {
                const response = await fetch('/api/excel/validate', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    // Xử lý download file
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    
                    let filename = 'Result_' + fileInput.files[0].name;
                    const disposition = response.headers.get('Content-Disposition');
                    if (disposition && disposition.indexOf('filename=') !== -1) {
                        const filenameRegex = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/;
                        const matches = filenameRegex.exec(disposition);
                        if (matches != null && matches[1]) { 
                            filename = matches[1].replace(/['"]/g, '');
                        }
                    }
                    
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    
                    showStatus('✅ Hoàn tất! File kết quả đã được tải xuống.', 'success');
                } else {
                    let errText = '';
                    try {
                        errText = await response.text();
                    } catch (e) {}
                    if (errText && errText.trim()) {
                        showStatus('❌ Lỗi xử lý: ' + errText.trim(), 'error');
                    } else {
                        showStatus('❌ Đã xảy ra lỗi trong quá trình xử lý trên máy chủ (Mã ' + response.status + ').', 'error');
                    }
                }
            } catch (error) {
                console.error(error);
                showStatus('❌ Lỗi kết nối máy chủ.', 'error');
            } finally {
                // Reset loading state
                btnText.style.display = 'block';
                loader.style.display = 'none';
                submitBtn.classList.remove('loading');
            }
        });

        const ToastManager = {
            _container: null,
            _init() {
                if (!this._container) {
                    this._container = document.getElementById('bqp_toast_container');
                    if (!this._container) {
                        this._container = document.createElement('div');
                        this._container.id = 'bqp_toast_container';
                        document.body.appendChild(this._container);
                    }
                }
            },
            show(message, type = 'info') {
                this._init();
                const toast = document.createElement('div');
                toast.className = `bqp-toast bqp-toast-${type}`;
                toast.innerHTML = `
                    <div class="bqp-toast-content">${message}</div>
                    <button class="bqp-toast-close" type="button">&times;</button>
                `;
                toast.querySelector('.bqp-toast-close').onclick = () => {
                    toast.classList.remove('bqp-toast-visible');
                    setTimeout(() => toast.remove(), 260);
                };
                this._container.appendChild(toast);
                setTimeout(() => toast.classList.add('bqp-toast-visible'), 10);
                setTimeout(() => {
                    toast.classList.remove('bqp-toast-visible');
                    setTimeout(() => toast.remove(), 260);
                }, type === 'error' ? 8000 : (type === 'warning' ? 6000 : 4000));
            },
            success(msg) { this.show(msg, 'success'); },
            error(msg) { this.show(msg, 'error'); }
        };

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = `status-message status-${type}`;
            if (type === 'success') ToastManager.success(message);
            else if (type === 'error') ToastManager.error(message);
            else ToastManager.show(message, 'info');
        }
    </script>
</body>
</html>
